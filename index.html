    <style>
      body {

        font-family: serif;
      }
      .restaurantsite-header {
        width: 100%;
        background-image: linear-gradient(135deg, #4a4a4a, #800020);
        padding: 20px;
        border-bottom: 2px solid #ddd;
        display: flex;
        justify-content: space-between;
        box-sizing: border-box;
        gap: 16px;
        align-items: center;
        margin-left: auto;
        margin-right: auto;
      }
      .logo-box {
        min-width: 0;
      }
      .logo {
        display: block;
        max-width: 100%;
        object-fit: contain;

        padding: 20px 0;
        border-bottom: 2px solid #ddd;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

  </head>

  <script>

      document.getElementById(tabId).hidden = false;
      document.querySelectorAll(".button-row button").forEach(button => {
      });

  <body>
