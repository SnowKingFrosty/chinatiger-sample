<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>China Tiger</title>
    <link rel="stylesheet" href="styles.css?v=tab-fix-3">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: serif;
      }
      .restaurantsite-header {
        width: 100%;
        background-image: linear-gradient(135deg, #4a4a4a, #800020);
        padding: 20px;
        border-bottom: 2px solid #ddd;
        display: flex;
        justify-content: space-between;
        box-sizing: border-box;
        gap: 16px;
        align-items: center;
        margin-left: auto;
        margin-right: auto;
      }
      .logo-box {
        min-width: 0;
      }
      .logo {
        display: block;
        max-width: 100%;
        object-fit: contain;
        max-height: 60px;
        width: auto;
      }

      .contact-us {
        width: 100%;
        background-color: gray;
        padding: 20px 0;
        border-bottom: 2px solid #ddd;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
    </style>
  </head>


  <body>
    <div class="restaurantsite-header">
      <header class="logo-box"><img src="chinatigerlogo.png" alt="logo" class="logo"></header>
      <a href="contact.html" class="contact-button">Contact Us</a>
    </div>
    <nav class="button-row" aria-label="Main navigation">
      <button type="button" class="active" onclick="showTab('home', this)">Home</button>
      <button type="button" onclick="showTab('about', this)">About Us</button>
      <button type="button" onclick="showTab('menu', this)">Menu</button>
    </nav>
    <main>
      <section id="home" class="tab-content">
        <h1>Welcome to China Tiger</h1>
        <p>Placeholder</p>
      </section>
      <section id="about" class="tab-content" hidden>
        <h1>About Us</h1>
        <p>Placeholder</p>
      </section>
      <section id="menu" class="tab-content" hidden>
        <h1>Our Menu</h1>
        <p>Placeholder</p>
      </section>
    </main>
  <script>
    function showTab(tabId, clickedButton) {
      // Show only the section matching the selected tab.
      document.querySelectorAll(".tab-content").forEach(section => {
        section.hidden = section.id !== tabId;
      });

      // Highlight only the selected button.
      document.querySelectorAll(".button-row button").forEach(button => {
        button.classList.toggle("active", button === clickedButton);
      });
    }
  </script>
  </body>
</html>
